receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # MySQL receiver configuration
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/mysqlreceiver
  mysql:
    endpoint: ht-mysql:3306
    username: myuser
    password: mypassword
    database: mydatabase
    collection_interval: 10s
    initial_delay: 1s
    statement_events:
      digest_text_limit: 120
      time_limit: 24h
      limit: 250

processors:
  tail_sampling:
    decision_wait: 10s
    num_traces: 10000
    expected_new_traces_per_sec: 100
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes:
            - ERROR

      - name: keep-slow
        type: latency
        latency:
          threshold_ms: 1000

      - name: sample-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

  batch:

exporters:
  debug:
    verbosity: detailed
  otlp:
    endpoint: "http://ht-jaeger:4317"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [debug,otlp]

    metrics:
      # MySQL receiver configuration
      receivers: [otlp, mysql]
      processors: [batch]
      exporters: [debug]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
