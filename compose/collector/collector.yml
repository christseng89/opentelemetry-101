receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
  resource:
    attributes:
    - key: key.test
      value: "via-collector"
      action: insert
  tail_sampling:
    decision_wait: 10s
    policies:
      [
          {
            name: high-latency,
            type: latency,
            latency: {threshold_ms: 500}
          },
          {
            name: http_error_only,
            type: numeric_attribute,
            numeric_attribute: {key: http.status_code, min_value: 500, max_value: 599}
          },
          {
            name: local_demo_all_traces,
            type: always_sample
          }
      ]
exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889

extensions:
  health_check:

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch, resource]
      exporters: [otlp_grpc/jaeger, otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlp_http/loki]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [prometheus]
