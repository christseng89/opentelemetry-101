global:
  scrape_interval: 1s # Default is every 1 minute.

scrape_configs:
  - job_name: 'opentelemetry'
    static_configs:
      - targets: ['collector:8889']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:8888']

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
