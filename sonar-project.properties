sonar.projectKey=opentelemetry-101-java-tracing
sonar.projectName=opentelemetry-101-java-tracing

sonar.sources=app-versions/code,java-todo-service/src/main
sonar.tests=java-todo-service/src/test
sonar.exclusions=**/node_modules/**,**/target/**,**/compose/**,**/docs/**

sonar.java.source=21
sonar.java.binaries=java-todo-service/target/classes
sonar.java.test.binaries=java-todo-service/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=java-todo-service/target/site/jacoco/jacoco.xml

# Keep all source files in static analysis, but measure coverage on business code.
# Entry points and telemetry adapters are integration wiring and are covered by
# deployment/integration checks rather than unit tests in this learning project.
sonar.coverage.exclusions=app-versions/code/**,java-todo-service/src/main/java/com/example/todo/telemetry/**,java-todo-service/src/main/java/com/example/todo/TodoApplication.java,java-todo-service/src/main/java/com/example/todo/TodoController.java,java-todo-service/src/main/java/com/example/todo/OpenTelemetryConfiguration.java

# Docker Desktop mounts the Windows worktree into the Linux scanner container.
sonar.scm.disabled=true
